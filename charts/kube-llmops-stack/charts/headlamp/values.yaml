headlamp:
  # ---- OIDC (Keycloak) -------------------------------------------------
  config:
    oidc:
      clientID: ""
      clientSecret: ""
      issuerURL: ""
      scopes: "openid profile email"

  # ---- RBAC -------------------------------------------------------------
  clusterRoleBinding:
    create: true

  # ---- Service -----------------------------------------------------------
  service:
    type: ClusterIP
    port: 80

  # ---- Plugin volume -----------------------------------------------------
  volumes:
    - name: plugins
      emptyDir: {}

  volumeMounts:
    - name: plugins
      mountPath: /headlamp/plugins

  # ---- Plugin init container ---------------------------------------------
  initContainers:
    - name: install-llmops-plugin
      image: "localhost:5000/kube-llmops/headlamp-plugin:latest"
      command: ["sh", "-c", "cp -r /plugins/* /headlamp/plugins/"]
      volumeMounts:
        - name: plugins
          mountPath: /headlamp/plugins

# -- Plugin image (overridable) ---
plugin:
  image: "localhost:5000/kube-llmops/headlamp-plugin"
  tag: "latest"
