{{/*
  Auto-generate a self-signed TLS certificate for Keycloak HTTPS.
  Persisted via lookup — only generated on first install.
  Extract CA for k3s OIDC:
    kubectl get secret <release>-keycloak-tls -o jsonpath='{.data.ca\.crt}' | base64 -d
*/}}
{{- if and .Values.enabled .Values.tls.enabled .Values.tls.selfSigned (not .Values.tls.existingSecret) }}
{{- $secretName := printf "%s-keycloak-tls" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $existing }}
{{- $svcName := printf "%s-keycloak" .Release.Name }}
{{- $altNames := list $svcName (printf "%s.%s.svc" $svcName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $svcName .Release.Namespace) }}
{{- $altIPs := list "127.0.0.1" }}
{{- if and .Values.global .Values.global.nodePort .Values.global.nodePort.host }}
  {{- $altIPs = append $altIPs .Values.global.nodePort.host }}
{{- end }}
{{- $ca := genCA "kube-llmops-keycloak-ca" 3650 }}
{{- $cert := genSignedCert "keycloak" $altIPs $altNames 3650 $ca }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: kube-llmops
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
