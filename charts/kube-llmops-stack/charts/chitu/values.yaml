# Chitu (赤兔) sub-chart default values
# These are overridden by the parent chart's models[] entries

enabled: true

# Model defaults (typically overridden per-model from parent)
model:
  name: ""
  source: ""
  replicas: 1
  resources:
    gpu: 1
    memory: 16Gi
    cpu: 4
  engineArgs: {}

# Chitu container image
image:
  repository: qingcheng-ai-cn-beijing.cr.volces.com/public/chitu-nvidia_arch_90
  tag: latest
  pullPolicy: IfNotPresent

# Service
service:
  type: ClusterIP
  port: 21002
  nodePort: null              # Set when service.type=NodePort

# Probes — tuned for LLM model loading (typically 1-10 min)
readinessProbe:
  httpGet:
    path: /v1/models
    port: 21002
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60     # ~10 min total (60s + 60*10s)

livenessProbe:
  httpGet:
    path: /v1/models
    port: 21002
  initialDelaySeconds: 300  # 5 min grace for model download + load
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 20     # ~15 min total (300s + 20*30s)

# Model loader init container
modelLoader:
  enabled: true
  image:
    repository: python
    tag: "3.13-slim"
    pullPolicy: IfNotPresent
  # HuggingFace token for gated models (Llama, Gemma, etc.)
  # Usually passed from global.hfToken; set here for per-subchart override
  hfToken: ""

# Model cache volume
modelCache:
  enabled: true
  storageClass: ""
  size: 50Gi
  # Use existing PVC (if set, storageClass and size are ignored)
  existingClaim: ""

# GPU tolerations (applied automatically when gpu > 0)
gpuToleration:
  key: nvidia.com/gpu
  operator: Exists
  effect: NoSchedule

# Unified memory GPU support (NVIDIA GB10, Grace Blackwell)
# When enabled:
#   - Runs drop-cache init container (privileged) to free page cache before model load
#   - Omits container memory limit (cgroup must not restrict unified memory)
# Leave DISABLED for discrete GPU systems (A100, H100, RTX, etc.)
unifiedMemory:
  enabled: false

# Custom CA certificates (for corporate proxies / self-signed certs)
# Mount a ConfigMap containing CA certs into containers
customCACert:
  enabled: false
  configMapName: ""           # Name of ConfigMap with CA cert files
  mountPath: /usr/local/share/ca-certificates/custom

# Chitu-specific Hydra config overrides
chituConfig:
  useCudaGraph: true
  softFp8: false
