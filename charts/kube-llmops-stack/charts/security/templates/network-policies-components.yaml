{{- if and .Values.enabled .Values.networkPolicy.enabled }}
---
# PostgreSQL: only allow litellm, langfuse, dify, dify-plugin-daemon
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-postgresql-ingress
  labels:
    app.kubernetes.io/part-of: kube-llmops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: kube-llmops
      ports:
        - port: 5432
---
# Redis: only allow langfuse, dify components
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-redis-ingress
  labels:
    app.kubernetes.io/part-of: kube-llmops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: kube-llmops
      ports:
        - port: 6379
---
# MinIO: only allow langfuse, dify, milvus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-minio-ingress
  labels:
    app.kubernetes.io/part-of: kube-llmops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: kube-llmops
      ports:
        - port: 9000
        - port: 9001
---
# LiteLLM Gateway: allow ingress from any (external API access)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-litellm-ingress
  labels:
    app.kubernetes.io/part-of: kube-llmops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 4000
{{- end }}
