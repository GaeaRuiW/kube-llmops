{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    remote_write: []
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: otel-collector
        static_configs:
          - targets: ["{{ $.Release.Name }}-otel-collector:8889"]
      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets: ["{{ $.Release.Name }}-pushgateway:9091"]
      - job_name: vllm
        static_configs:
          - targets: ["vllm-qwen2-5-0-5b:8000"]
      - job_name: milvus
        static_configs:
          - targets: ["{{ $.Release.Name }}-milvus:9091"]
  rules.yml: |
    groups:
      - name: vllm-alerts
        rules:
          - alert: VllmHighLatency
            expr: histogram_quantile(0.95, sum(rate(vllm:e2e_request_latency_seconds_bucket[5m])) by (le)) > 10
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "vLLM P95 latency above 10s"
              description: "P95 end-to-end latency is {{`{{ $value }}`}}s (threshold: 10s)"
          - alert: VllmHighQueueDepth
            expr: sum(vllm:num_requests_waiting) > 10
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "vLLM request queue depth above 10"
              description: "{{`{{ $value }}`}} requests waiting in queue"
          - alert: VllmKVCacheNearFull
            expr: avg(vllm:kv_cache_usage_perc) > 0.9
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "vLLM KV cache usage above 90%"
              description: "KV cache at {{`{{ $value | humanizePercentage }}`}}, risk of OOM or request rejection"
          - alert: VllmDown
            expr: up{job="vllm"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "vLLM instance down"
              description: "vLLM scrape target has been down for more than 1 minute"
          - alert: RAGHighRetrievalLatency
            expr: histogram_quantile(0.95, sum(rate(vllm:e2e_request_latency_seconds_bucket[5m])) by (le)) > 5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "RAG retrieval+generation P95 latency above 5s"
          - alert: RAGEmbeddingServiceDown
            expr: up{job="embedding"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Embedding service is down"
      - name: rag-quality-alerts
        rules:
          - alert: RAGFaithfulnessLow
            expr: ragas_faithfulness < 0.7
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "RAG Faithfulness below threshold"
              description: "Ragas faithfulness is {{ "{{ $value }}" }} (threshold: 0.7)"
          - alert: RAGFaithfulnessCritical
            expr: ragas_faithfulness < 0.5
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "RAG Faithfulness critically low"
              description: "Ragas faithfulness is {{ "{{ $value }}" }} (critical: 0.5)"
          - alert: RAGAnswerRelevancyLow
            expr: ragas_answer_relevancy < 0.7
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "RAG Answer Relevancy below threshold"
              description: "Ragas answer_relevancy is {{ "{{ $value }}" }} (threshold: 0.7)"
          - alert: RAGQualityRegression
            expr: ragas_faithfulness < 0.85 or ragas_answer_relevancy < 0.85
            for: 0m
            labels:
              severity: info
            annotations:
              summary: "RAG quality below production target"
              description: "Faithfulness={{ "{{ $value }}" }} or Relevancy below 0.85 production target"
          - alert: RAGEvalStale
            expr: time() - ragas_evaluation_timestamp > 172800
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "RAG evaluation data is stale (>48h)"
              description: "Last Ragas evaluation was more than 48 hours ago"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-prometheus-data
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.prometheus.storage.storageClass }}
  storageClassName: {{ .Values.prometheus.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.prometheus.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kube-llmops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: kube-llmops
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.prometheus.retention }}"
            - "--web.enable-remote-write-receiver"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: http
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.prometheus.resources.requests.cpu }}
              memory: {{ .Values.prometheus.resources.requests.memory }}
            limits:
              cpu: {{ .Values.prometheus.resources.limits.cpu | quote }}
              memory: {{ .Values.prometheus.resources.limits.memory }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules.yml
              subPath: rules.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ $.Release.Name }}-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: {{ .Values.prometheus.service.type | default "ClusterIP" }}
  ports:
    - port: 9090
      targetPort: http
      name: http
      {{- if and (eq (.Values.prometheus.service.type | default "ClusterIP") "NodePort") .Values.prometheus.service.nodePort }}
      nodePort: {{ .Values.prometheus.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $.Release.Name }}
---
# Prometheus Pushgateway — allows batch jobs (Ragas eval) to push metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-pushgateway
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kube-llmops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: kube-llmops
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
              name: http
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-pushgateway
  labels:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: ClusterIP
  ports:
    - port: 9091
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: pushgateway
    app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
