{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-grafana-data
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.grafana.storage.storageClass }}
  storageClassName: {{ .Values.grafana.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.storage.size }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://{{ $.Release.Name }}-prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://{{ $.Release.Name }}-loki:3100
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: kube-llmops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: kube-llmops
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | default "admin" | quote }}
            # Keep the built-in admin's email aligned with Keycloak's default admin
            # (admin@kube-llmops.local). Mismatched email breaks OIDC user sync
            # when preferred_username=admin on both sides — Grafana's sync aborts
            # with "Failed to create user: user not found" because it cannot
            # reconcile the existing local admin with the incoming OAuth identity.
            - name: GF_SECURITY_ADMIN_EMAIL
              value: {{ .Values.grafana.adminEmail | default "admin@kube-llmops.local" | quote }}
            - name: GF_INSTALL_PLUGINS
              value: ""
            {{- if .Values.grafana.oidc.enabled }}
            {{- $np := (default dict (default dict .Values.global).nodePort) }}
            {{- $npEnabled := and $np.enabled $np.host }}
            {{- $keycloakUrl := .Values.grafana.oidc.issuerUrl }}
            {{- $grafanaRoot := .Values.grafana.oidc.grafanaRootUrl | default "http://localhost:3000" }}
            {{- if $npEnabled }}
              {{- $keycloakUrl = printf "http://%s:%v/realms/kube-llmops" $np.host (default 30808 $np.keycloak) }}
              {{- $grafanaRoot = printf "http://%s:%v" $np.host (default 30300 $np.grafana) }}
            {{- end }}
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: {{ .Values.grafana.oidc.name | default "Keycloak" | quote }}
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: {{ .Values.grafana.oidc.clientId | quote }}
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              value: {{ .Values.grafana.oidc.clientSecret | quote }}
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "{{ $keycloakUrl }}/protocol/openid-connect/auth"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "{{ $keycloakUrl }}/protocol/openid-connect/token"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "{{ $keycloakUrl }}/protocol/openid-connect/userinfo"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            # Grafana 11+ changed users.allow_sign_up default: true -> false.
            # Without this, user.sync fails with "user not found" even when OAuth
            # succeeds, because the user service-level check blocks creation.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
              value: "preferred_username"
            - name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
              value: "email"
            - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
              value: "name"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: {{ .Values.grafana.oidc.roleAttributePath | default "contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'" | quote }}
            - name: GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP
              value: "true"
            - name: GF_SERVER_ROOT_URL
              value: {{ $grafanaRoot | quote }}
            {{- end }}
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.grafana.resources.requests.cpu }}
              memory: {{ .Values.grafana.resources.requests.memory }}
            limits:
              cpu: {{ .Values.grafana.resources.limits.cpu }}
              memory: {{ .Values.grafana.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboards-provision
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards-json
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-grafana-data
        - name: datasources
          configMap:
            name: {{ $.Release.Name }}-grafana-datasources
        - name: dashboards-provision
          configMap:
            name: {{ $.Release.Name }}-grafana-dashboard-provision
        - name: dashboards-json
          configMap:
            name: {{ $.Release.Name }}-grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-grafana-dashboard-provision
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: kube-llmops
        orgId: 1
        folder: kube-llmops
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: http
      name: http
      {{- if and (eq .Values.grafana.service.type "NodePort") .Values.grafana.service.nodePort }}
      nodePort: {{ .Values.grafana.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-grafana-dashboards
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
data:
  {{- $modules := default dict .Values.global.modules }}
  {{- $rag := default dict $modules.rag }}
  {{- $finetune := default dict $modules.finetune }}
  {{- $security := default dict $modules.security }}
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{- $name := base $path }}
  {{- $isRag := or (eq $name "rag-quality.json") (eq $name "milvus-overview.json") }}
  {{- $isFinetune := eq $name "finetune-overview.json" }}
  {{- $isSecurity := eq $name "tenant-overview.json" }}
  {{- $include := true }}
  {{- if and $isRag (hasKey $rag "enabled") (not $rag.enabled) }}
    {{- $include = false }}
  {{- end }}
  {{- if and $isFinetune (hasKey $finetune "enabled") (not $finetune.enabled) }}
    {{- $include = false }}
  {{- end }}
  {{- if and $isSecurity (hasKey $security "enabled") (not $security.enabled) }}
    {{- $include = false }}
  {{- end }}
  {{- if $include }}
  {{ $name }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
