{{- if and .Values.enabled .Values.setup.enabled }}
{{- $apiUrl := printf "http://%s-dify-api:5001" .Release.Name }}
{{- $litellmHost := .Values.litellm.host | default (printf "%s-litellm" .Release.Name) }}
{{- $litellmUrl := printf "http://%s:%v/v1" $litellmHost (.Values.litellm.port | default 4000) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dify-setup
  labels:
    app.kubernetes.io/name: dify-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
data:
  setup.sh: |
    #!/bin/bash
    set -e

    API="{{ $apiUrl }}"
    MAX_WAIT=300
    ADMIN_EMAIL="{{ .Values.setup.adminEmail }}"
    ADMIN_PASSWORD="{{ .Values.setup.adminPassword }}"
    ADMIN_NAME="{{ .Values.setup.adminName }}"
    PLUGIN_DIR="/plugin-storage"

    echo "=== Dify Auto-Setup ==="

    # ── Step 1: Wait for API ──
    echo "[1/5] Waiting for Dify API..."
    elapsed=0
    while [ $elapsed -lt $MAX_WAIT ]; do
      curl -sf "$API/health" > /dev/null 2>&1 && { echo "  API ready (${elapsed}s)"; break; }
      sleep 5; elapsed=$((elapsed + 5))
    done
    [ $elapsed -ge $MAX_WAIT ] && { echo "  TIMEOUT" >&2; exit 1; }

    # ── Step 2: Create admin account (idempotent) ──
    echo "[2/5] Checking setup status..."
    STEP=$(curl -sf "$API/console/api/setup" | python3 -c "import json,sys; print(json.load(sys.stdin).get('step',''))" 2>/dev/null)
    if [ "$STEP" = "not_started" ]; then
      echo "  Creating admin account..."
      curl -sf "$API/console/api/setup" -X POST \
        -H "Content-Type: application/json" \
        -d "{\"email\":\"$ADMIN_EMAIL\",\"name\":\"$ADMIN_NAME\",\"password\":\"$ADMIN_PASSWORD\"}" > /dev/null
      echo "  Admin created"
    else
      echo "  Already completed (step=$STEP)"
    fi

    # ── Step 3: Login ──
    echo "[3/5] Logging in..."
    B64_PW=$(echo -n "$ADMIN_PASSWORD" | base64)
    CK=$(mktemp)
    curl -sf -c "$CK" "$API/console/api/login" -X POST \
      -H "Content-Type: application/json" \
      -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$B64_PW\"}" > /dev/null
    CSRF=$(grep csrf_token "$CK" | awk '{print $NF}')
    [ -z "$CSRF" ] && { echo "  Login failed" >&2; exit 1; }
    echo "  Logged in"

    G() { curl -sf -b "$CK" -H "X-CSRF-Token: $CSRF" "$API$1"; }
    P() { curl -sf -b "$CK" -H "X-CSRF-Token: $CSRF" -H "Content-Type: application/json" -X POST "$API$1" -d "$2"; }

    # ── Step 4: Install plugins ──
    echo "[4/5] Installing plugins..."
    INSTALLED=$(G "/console/api/workspaces/current/plugin/list?page=1&page_size=100" | \
      python3 -c "import json,sys; print(' '.join(p['plugin_id'] for p in json.load(sys.stdin).get('plugins',[])))" 2>/dev/null)

    {{- range .Values.setup.plugins }}
    PLUGIN_ID="{{ .id }}"
    PLUGIN_SHORT=$(echo "$PLUGIN_ID" | cut -d/ -f2)

    if echo "$INSTALLED" | grep -qw "$PLUGIN_ID"; then
      echo "  $PLUGIN_ID: already installed"
    else
      # Find pre-seeded .difypkg in shared PVC
      PKG=$(find "$PLUGIN_DIR" -maxdepth 1 -name "${PLUGIN_SHORT}*.difypkg" -type f 2>/dev/null | head -1)
      [ -z "$PKG" ] && { echo "  ERROR: no .difypkg for $PLUGIN_ID"; continue; }
      echo "  Uploading $PLUGIN_SHORT ($(stat -c%s "$PKG")B)..."

      # Upload
      PLUGIN_UID=$(curl -sf -b "$CK" -H "X-CSRF-Token: $CSRF" \
        -X POST "$API/console/api/workspaces/current/plugin/upload/pkg" \
        -F "pkg=@$PKG" | python3 -c "import json,sys; print(json.load(sys.stdin).get('unique_identifier',''))" 2>/dev/null)
      [ -z "$PLUGIN_UID" ] && { echo "  Upload failed"; continue; }
      echo "  Uploaded: ${PLUGIN_UID:0:60}..."

      # Wait for daemon to extract, then pre-install deps
      sleep 5
      CWD=$(find "$PLUGIN_DIR/cwd" -maxdepth 2 -name "${PLUGIN_SHORT}*" -type d 2>/dev/null | head -1)
      if [ -n "$CWD" ] && [ -f "$CWD/pyproject.toml" ]; then
        echo "  Pre-installing Python deps..."
        pip install -q uv 2>/dev/null
        uv sync --project "$CWD" --quiet 2>/dev/null && echo "  Deps ready" || echo "  Deps warn (will retry)"
      fi

      # Install (may fail first time, retry after deps are cached)
      echo "  Installing..."
      TID=$(P "/console/api/workspaces/current/plugin/install/pkg" \
        "{\"plugin_unique_identifiers\":[\"$PLUGIN_UID\"]}" | \
        python3 -c "import json,sys; print(json.load(sys.stdin).get('task_id',''))" 2>/dev/null)

      OK=false
      for attempt in 1 2; do
        for i in $(seq 1 20); do
          sleep 5
          ST=$(G "/console/api/workspaces/current/plugin/tasks?action=install&page=1&page_size=5" | \
            python3 -c "
    import json,sys
    for t in json.load(sys.stdin).get('tasks',[]):
        if t['id']=='$TID': print(t['status']); break
    " 2>/dev/null)
          [ "$ST" = "success" ] && { echo "  $PLUGIN_ID installed (attempt $attempt)"; OK=true; break 2; }
          [ "$ST" = "failed" ] && break
        done
        [ "$OK" = "true" ] && break
        [ $attempt -eq 1 ] && {
          echo "  Attempt 1 failed, retrying..."
          TID=$(P "/console/api/workspaces/current/plugin/install/pkg" \
            "{\"plugin_unique_identifiers\":[\"$PLUGIN_UID\"]}" | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('task_id',''))" 2>/dev/null)
        }
      done
      [ "$OK" = "false" ] && echo "  WARNING: $PLUGIN_ID install failed after retries"
    fi
    {{- end }}

    {{- if .Values.setup.modelProvider.enabled }}
    # ── Step 5: Configure model provider ──
    echo "[5/5] Configuring model provider..."
    CREDS_URL="/console/api/workspaces/current/model-providers/openai_api_compatible/models/credentials"
    LITELLM_URL="{{ $litellmUrl }}"
    LITELLM_KEY="{{ .Values.litellm.apiKey }}"

    # Add embedding model
    echo "  Adding embedding model (bge-small-en)..."
    RESP=$(P "$CREDS_URL" "{\"model\":\"bge-small-en\",\"model_type\":\"text-embedding\",\"credentials\":{\"api_key\":\"$LITELLM_KEY\",\"endpoint_url\":\"$LITELLM_URL\",\"mode\":\"embedding\",\"context_size\":\"512\"}}" 2>&1) || true
    echo "  $RESP" | head -c 100
    echo ""

    # Add LLM model
    echo "  Adding LLM model (qwen2-5-0-5b)..."
    RESP2=$(P "$CREDS_URL" "{\"model\":\"qwen2-5-0-5b\",\"model_type\":\"llm\",\"credentials\":{\"api_key\":\"$LITELLM_KEY\",\"endpoint_url\":\"$LITELLM_URL\",\"mode\":\"chat\",\"context_size\":\"4096\"}}" 2>&1) || true
    echo "  $RESP2" | head -c 100
    echo ""
    {{- end }}

    echo ""
    echo "=== Dify Auto-Setup Complete ==="
    rm -f "$CK"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-dify-setup
  labels:
    app.kubernetes.io/name: dify-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Copy pre-bundled .difypkg files into the shared PVC
        - name: seed-plugins
          image: python:3.12-slim
          command: ["bash", "-c"]
          args:
            - |
              for f in /plugin-pkgs/*.difypkg; do
                [ -f "$f" ] || continue
                NAME=$(basename "$f")
                DEST="/plugin-storage/$NAME"
                if [ ! -f "$DEST" ] || [ "$(stat -c%s "$DEST" 2>/dev/null)" -lt 1000 ]; then
                  echo "Copying $NAME ($(stat -c%s "$f")B)..."
                  cp "$f" "$DEST"
                else
                  echo "$NAME already exists ($(stat -c%s "$DEST")B)"
                fi
              done
          volumeMounts:
            - name: plugin-pkgs
              mountPath: /plugin-pkgs
            - name: plugin-storage
              mountPath: /plugin-storage
      containers:
        - name: setup
          image: python:3.12-slim
          command: ["bash", "-c", "apt-get update -qq && apt-get install -qq -y curl > /dev/null 2>&1 && bash /scripts/setup.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugin-storage
              mountPath: /plugin-storage
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-dify-setup
        - name: plugin-pkgs
          secret:
            secretName: {{ .Release.Name }}-dify-plugin-packages
        - name: plugin-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dify-plugin-storage
---
# Secret with binary plugin packages (Secret supports up to 1MB vs ConfigMap annotation limits)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-dify-plugin-packages
  labels:
    app.kubernetes.io/name: dify-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  {{- range .Values.setup.plugins }}
  {{ index (splitList "/" .id) 1 }}.difypkg: {{ $.Files.Get (printf "files/%s.difypkg" (index (splitList "/" .id) 1)) | b64enc }}
  {{- end }}
{{- end }}
