{{- if and .Values.enabled .Values.setup.enabled }}
{{- $apiUrl := printf "http://%s-dify-api:5001" .Release.Name }}
{{- $litellmHost := .Values.litellm.host | default (printf "%s-litellm" .Release.Name) }}
{{- $litellmUrl := printf "http://%s:%v/v1" $litellmHost (.Values.litellm.port | default 4000) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dify-setup
  labels:
    app.kubernetes.io/name: dify-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
data:
  setup.sh: |
    #!/bin/bash
    set -e

    API="{{ $apiUrl }}"
    MAX_WAIT=300
    ADMIN_EMAIL="{{ .Values.setup.adminEmail }}"
    ADMIN_PASSWORD="{{ .Values.setup.adminPassword }}"
    ADMIN_NAME="{{ .Values.setup.adminName }}"
    PLUGIN_DIR="/plugin-storage"

    echo "=== Dify Auto-Setup ==="

    # ── Step 1: Wait for API to be ready ──
    echo "[1/5] Waiting for Dify API..."
    elapsed=0
    while [ $elapsed -lt $MAX_WAIT ]; do
      if curl -sf "$API/health" > /dev/null 2>&1; then
        echo "  API ready (${elapsed}s)"
        break
      fi
      sleep 5
      elapsed=$((elapsed + 5))
    done
    [ $elapsed -ge $MAX_WAIT ] && { echo "  TIMEOUT" >&2; exit 1; }

    # ── Step 2: Create admin account (idempotent) ──
    echo "[2/5] Checking setup status..."
    STEP=$(curl -sf "$API/console/api/setup" | python3 -c "import json,sys; print(json.load(sys.stdin).get('step',''))" 2>/dev/null)
    if [ "$STEP" = "not_started" ]; then
      echo "  Creating admin account..."
      curl -sf "$API/console/api/setup" -X POST \
        -H "Content-Type: application/json" \
        -d "{\"email\":\"$ADMIN_EMAIL\",\"name\":\"$ADMIN_NAME\",\"password\":\"$ADMIN_PASSWORD\"}" > /dev/null
      echo "  Admin account created"
    else
      echo "  Setup already completed (step=$STEP)"
    fi

    # ── Step 3: Login ──
    echo "[3/5] Logging in..."
    B64_PW=$(echo -n "$ADMIN_PASSWORD" | base64)
    COOKIES=$(mktemp)
    curl -sf -c "$COOKIES" "$API/console/api/login" -X POST \
      -H "Content-Type: application/json" \
      -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$B64_PW\"}" > /dev/null
    CSRF=$(grep csrf_token "$COOKIES" | awk '{print $NF}')
    [ -z "$CSRF" ] && { echo "  Login failed" >&2; exit 1; }
    echo "  Logged in OK"

    api_get()  { curl -sf -b "$COOKIES" -H "X-CSRF-Token: $CSRF" "$API$1"; }
    api_post() { curl -sf -b "$COOKIES" -H "X-CSRF-Token: $CSRF" -H "Content-Type: $2" "$API$1" -X POST -d "$3"; }

    # ── Step 4: Install plugins from local .difypkg files ──
    echo "[4/5] Installing plugins..."
    INSTALLED=$(api_get "/console/api/workspaces/current/plugin/list?page=1&page_size=100" | \
      python3 -c "import json,sys; print(' '.join(p['plugin_id'] for p in json.load(sys.stdin).get('plugins',[])))" 2>/dev/null)

    {{- range .Values.setup.plugins }}
    PLUGIN_ID="{{ .id }}"
    PLUGIN_SHORT=$(echo "$PLUGIN_ID" | cut -d/ -f2)

    if echo "$INSTALLED" | grep -qw "$PLUGIN_ID"; then
      echo "  $PLUGIN_ID already installed, skipping"
    else
      # Look for .difypkg in the shared plugin storage PVC
      PKG_FILE=$(find "$PLUGIN_DIR" -maxdepth 1 -name "${PLUGIN_SHORT}*.difypkg" -type f 2>/dev/null | head -1)
      if [ -z "$PKG_FILE" ]; then
        echo "  WARNING: No .difypkg found for $PLUGIN_ID in $PLUGIN_DIR"
        echo "  To fix: kubectl cp <file>.difypkg <plugin-daemon-pod>:/app/storage/${PLUGIN_SHORT}.difypkg"
        continue
      fi
      echo "  Found: $PKG_FILE ($(stat -c%s "$PKG_FILE" 2>/dev/null)B)"

      # Upload to Dify
      UPLOADED_ID=$(curl -sf -b "$COOKIES" -H "X-CSRF-Token: $CSRF" \
        -X POST "$API/console/api/workspaces/current/plugin/upload/pkg" \
        -F "pkg=@$PKG_FILE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('unique_identifier',''))" 2>/dev/null)

      if [ -z "$UPLOADED_ID" ]; then
        echo "  WARNING: Upload failed for $PLUGIN_ID" >&2
        continue
      fi
      echo "  Uploaded: $UPLOADED_ID"

      # Pre-install Python deps (workaround: plugin daemon uses offline uv sync)
      PLUGIN_CWD=$(find "$PLUGIN_DIR/cwd" -maxdepth 2 -type d -name "${PLUGIN_SHORT}*" 2>/dev/null | head -1)
      if [ -n "$PLUGIN_CWD" ] && [ -f "$PLUGIN_CWD/pyproject.toml" ]; then
        echo "  Pre-installing Python deps..."
        /usr/local/bin/uv sync --project "$PLUGIN_CWD" 2>/dev/null && echo "  Deps OK" || echo "  Deps failed (will retry)"
      fi

      # Install plugin
      echo "  Installing..."
      TASK_ID=$(api_post "/console/api/workspaces/current/plugin/install/pkg" \
        "application/json" \
        "{\"plugin_unique_identifiers\":[\"$UPLOADED_ID\"]}" | \
        python3 -c "import json,sys; print(json.load(sys.stdin).get('task_id',''))" 2>/dev/null)

      # Wait for completion
      for i in $(seq 1 24); do
        sleep 5
        STATUS=$(api_get "/console/api/workspaces/current/plugin/tasks?action=install&page=1&page_size=5" | \
          python3 -c "
    import json,sys
    for t in json.load(sys.stdin).get('tasks',[]):
        if t['id']=='$TASK_ID': print(t['status']); break
    " 2>/dev/null)
        [ "$STATUS" = "success" ] && { echo "  $PLUGIN_ID installed OK"; break; }
        if [ "$STATUS" = "failed" ]; then
          echo "  First attempt failed, retrying (deps should be cached)..."
          TASK_ID=$(api_post "/console/api/workspaces/current/plugin/install/pkg" \
            "application/json" \
            "{\"plugin_unique_identifiers\":[\"$UPLOADED_ID\"]}" | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('task_id',''))" 2>/dev/null)
          sleep 15
          STATUS2=$(api_get "/console/api/workspaces/current/plugin/tasks?action=install&page=1&page_size=5" | \
            python3 -c "
    import json,sys
    for t in json.load(sys.stdin).get('tasks',[]):
        if t['id']=='$TASK_ID': print(t['status']); break
    " 2>/dev/null)
          [ "$STATUS2" = "success" ] && echo "  $PLUGIN_ID installed OK (retry)" || echo "  WARNING: $PLUGIN_ID install failed"
          break
        fi
      done
    fi
    {{- end }}

    {{- if .Values.setup.modelProvider.enabled }}
    # ── Step 5: Summary ──
    echo "[5/5] Model provider setup info:"
    echo "  LiteLLM endpoint: {{ $litellmUrl }}"
    echo "  API Key: {{ .Values.litellm.apiKey }}"
    echo "  Configure in Dify UI: Settings → Model Provider → OpenAI-API-compatible"
    {{- end }}

    echo ""
    echo "=== Dify Auto-Setup Complete ==="
    rm -f "$COOKIES"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-dify-setup
  labels:
    app.kubernetes.io/name: dify-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dify-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: python:3.12-slim
          command: ["bash", "-c", "apt-get update -qq && apt-get install -qq -y curl > /dev/null 2>&1 && pip install -q uv > /dev/null 2>&1 && bash /scripts/setup.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugin-storage
              mountPath: /plugin-storage
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-dify-setup
        - name: plugin-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dify-plugin-storage
{{- end }}
