{{- if not (.Values.pluginDaemon.existingSecret | default "") }}
{{- $secretName := include "dify.pluginDaemonSecretName" . }}
{{- $keyName := include "dify.pluginDaemonKeySecretKey" . }}
{{- $innerKeyName := include "dify.pluginDaemonInnerApiKeySecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = $existing.data | default dict }}
{{- end }}
{{- $daemonKey := .Values.pluginDaemon.key | default "" }}
{{- if not $daemonKey }}
{{- $existingDaemonKey := index $existingData $keyName | default "" }}
{{- if $existingDaemonKey }}
{{- $daemonKey = $existingDaemonKey | b64dec }}
{{- else }}
{{- $daemonKey = randAlphaNum 64 }}
{{- end }}
{{- end }}
{{- $innerApiKey := .Values.pluginDaemon.innerApiKey | default "" }}
{{- if not $innerApiKey }}
{{- $existingInnerApiKey := index $existingData $innerKeyName | default "" }}
{{- if $existingInnerApiKey }}
{{- $innerApiKey = $existingInnerApiKey | b64dec }}
{{- else }}
{{- $innerApiKey = randAlphaNum 64 }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: dify
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: plugin-daemon
    app.kubernetes.io/part-of: kube-llmops
type: Opaque
data:
  {{ $keyName }}: {{ $daemonKey | b64enc | quote }}
  {{ $innerKeyName }}: {{ $innerApiKey | b64enc | quote }}
{{- end }}
