{{- $models := .Values.models }}
{{- if and .Values.global .Values.global.models }}
{{- $models = .Values.global.models }}
{{- end }}
{{- range $idx, $model := $models }}
{{- $resolvedEngine := include "kube-llmops.resolveEngine" $model | trim }}
{{- if eq $resolvedEngine "llamacpp" }}
{{- $resources := default dict $model.resources }}
{{- $gpu := ternary (int $resources.gpu) 0 (hasKey $resources "gpu") }}
{{- $memory := default "8Gi" $resources.memory }}
{{- $cpu := default "4" $resources.cpu }}
{{- $replicas := default 1 $model.replicas }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-{{ $model.name }}
  labels:
    app.kubernetes.io/name: llamacpp
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: kube-llmops
    kube-llmops/model: {{ $model.name }}
    kube-llmops/engine: llamacpp
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llamacpp
      app.kubernetes.io/instance: {{ $.Release.Name }}
      kube-llmops/model: {{ $model.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llamacpp
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: model-serving
        app.kubernetes.io/part-of: kube-llmops
        kube-llmops/model: {{ $model.name }}
        kube-llmops/engine: llamacpp
    spec:
      initContainers:
        - name: model-loader
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
{{ include "kube-llmops.modelLoaderScript" . | indent 14 }}
              # GGUF: find the .gguf file and symlink to expected path
              python3 -c "
              import os, glob
              from pathlib import Path
              slug = '{{ replace "/" "--" $model.source }}'
              src_dir = Path('/models') / slug
              gguf_files = list(src_dir.glob('**/*.gguf')) + list(src_dir.glob('**/*.GGUF'))
              if gguf_files:
                  target = Path('/models/{{ $model.name }}.gguf')
                  if not target.exists():
                      os.symlink(str(gguf_files[0]), str(target))
                      print(f'Linked {gguf_files[0]} → {target}')
                  else:
                      print(f'GGUF already at {target}')
              else:
                  print(f'WARNING: No .gguf file found in {src_dir}')
              "
          env:
{{ include "kube-llmops.modelLoaderEnv" (dict "model" $model "root" $ "mountPath" "/models") | indent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      containers:
        - name: llamacpp
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - "--model"
            - "/models/{{ $model.name }}.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            {{- if gt $gpu 0 }}
            - "--n-gpu-layers"
            - "999"
            {{- end }}
            {{- range $key, $val := $model.engineArgs }}
            - {{ $key | quote }}
            {{- if $val }}
            - {{ $val | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          resources:
            requests:
              cpu: {{ $cpu | quote }}
              memory: {{ $memory }}
              {{- if gt $gpu 0 }}
              nvidia.com/gpu: {{ $gpu | quote }}
              {{- end }}
            limits:
              memory: {{ $memory }}
              {{- if gt $gpu 0 }}
              nvidia.com/gpu: {{ $gpu | quote }}
              {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
      {{- if gt $gpu 0 }}
      tolerations:
        - key: {{ $.Values.gpuToleration.key }}
          operator: {{ $.Values.gpuToleration.operator }}
          effect: {{ $.Values.gpuToleration.effect }}
      {{- end }}
      volumes:
        - name: model-cache
          {{- if and $.Values.modelCache.enabled (not $.Values.modelCache.existingClaim) }}
          persistentVolumeClaim:
            claimName: llamacpp-{{ $model.name }}-cache
          {{- else if $.Values.modelCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelCache.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $.Values.modelCache.size }}
          {{- end }}
{{- end }}
{{- end }}
