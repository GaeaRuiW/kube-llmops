{{/*
Fluid Dataset + AlluxioRuntime per model.
Requires Fluid operator to be installed in the cluster.
Creates a FUSE-mounted PVC per model for zero-copy shared access.

When Fluid is enabled, engine pods mount model-cache-<name> PVC
instead of using model-loader init containers.
*/}}
{{- if and .Values.enabled .Values.fluidCache.enabled }}
{{- $models := (index .Values "vllmModels" | default list) }}
{{- if and $.Values.global $.Values.global.models }}
{{- $models = $.Values.global.models }}
{{- end }}
{{- range $idx, $model := $models }}
{{- $slug := replace "/" "--" $model.source }}
---
apiVersion: fluid.io/v1alpha1
kind: Dataset
metadata:
  name: model-cache-{{ $model.name }}
  labels:
    app.kubernetes.io/name: fluid-dataset
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
    kube-llmops/model: {{ $model.name }}
spec:
  mounts:
    - mountPoint: s3://{{ $.Values.minio.bucket | default "models" }}/{{ $slug }}/
      name: {{ $model.name }}
      options:
        fs.s3a.endpoint: http://{{ $.Release.Name }}-minio:{{ $.Values.minio.service.port | default 9000 }}
        fs.s3a.access.key: {{ $.Values.minio.accessKey }}
        fs.s3a.secret.key: {{ $.Values.minio.secretKey }}
        fs.s3a.path.style.access: "true"
---
apiVersion: fluid.io/v1alpha1
kind: AlluxioRuntime
metadata:
  name: model-cache-{{ $model.name }}
  labels:
    app.kubernetes.io/name: fluid-alluxio-runtime
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
    kube-llmops/model: {{ $model.name }}
spec:
  replicas: {{ $.Values.alluxio.replicas }}
  tieredstore:
    levels:
      {{- range $tierIdx, $tier := $.Values.alluxio.tieredStore }}
      - mediumtype: {{ $tier.mediumtype }}
        path: {{ $tier.path }}
        quota: {{ $tier.quota }}
        level: {{ $tierIdx }}
      {{- end }}
  master:
    jvmOptions:
      {{- toYaml $.Values.alluxio.jvmOptions | nindent 6 }}
  worker:
    jvmOptions:
      {{- toYaml $.Values.alluxio.jvmOptions | nindent 6 }}
  fuse:
    global: true
{{- end }}
{{- end }}
