{{/*
This template renders one Deployment per model entry that uses vllm engine.
It is called from the parent chart with model-specific context.
*/}}
{{- range $idx, $model := .Values.models }}
{{- if or (eq (default "auto" $model.engine) "vllm") (eq (default "auto" $model.engine) "auto") }}
{{- $resources := default dict $model.resources }}
{{- $gpu := ternary (int $resources.gpu) 1 (hasKey $resources "gpu") }}
{{- $memory := default "16Gi" $resources.memory }}
{{- $memoryLimit := $resources.memoryLimit }}
{{- $cpu := default "4" $resources.cpu }}
{{- $replicas := default 1 $model.replicas }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $model.name }}
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: kube-llmops
    kube-llmops/model: {{ $model.name }}
    kube-llmops/engine: vllm
spec:
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: {{ $.Release.Name }}
      kube-llmops/model: {{ $model.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: model-serving
        app.kubernetes.io/part-of: kube-llmops
        kube-llmops/model: {{ $model.name }}
        kube-llmops/engine: vllm
    spec:
      initContainers:
        - name: drop-cache
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "Dropping page cache for unified-memory GPU..."
              echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
              echo "Done. Free memory:"
              cat /proc/meminfo | head -3
          securityContext:
            privileged: true
        {{- if $.Values.customCACert.enabled }}
        - name: ca-cert-installer
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              cp /custom-ca/* /usr/local/share/ca-certificates/ 2>/dev/null || true
              update-ca-certificates 2>/dev/null || cat /custom-ca/*.crt >> /etc/ssl/certs/ca-certificates.crt
              cp /etc/ssl/certs/ca-certificates.crt /ca-out/ca-certificates.crt
              echo "CA certs updated"
          volumeMounts:
            - name: custom-ca
              mountPath: /custom-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-out
        {{- end }}
        {{- if $.Values.modelLoader.enabled }}
        - name: model-loader
          image: "{{ $.Values.modelLoader.image.repository }}:{{ $.Values.modelLoader.image.tag }}"
          imagePullPolicy: {{ $.Values.modelLoader.image.pullPolicy }}
          command: ["bash", "-c"]
          args:
            - |
              pip install -q minio huggingface_hub 2>/dev/null
              python3 -c "
              import os, sys, logging
              from pathlib import Path
              logging.basicConfig(level=logging.INFO, format='%(asctime)s [model-loader] %(levelname)s %(message)s')
              log = logging.getLogger('model-loader')
              source = os.environ.get('MODEL_SOURCE', '')
              target = Path(os.environ.get('MODEL_DIR', '/models'))
              target.mkdir(parents=True, exist_ok=True)
              if not source:
                  log.error('MODEL_SOURCE required'); sys.exit(1)
              if source.startswith('s3://'):
                  from minio import Minio
                  parts = source.replace('s3://', '').split('/', 1)
                  bucket, prefix = parts[0], parts[1] if len(parts)>1 else ''
                  endpoint = os.environ.get('S3_ENDPOINT', '{{ $.Release.Name }}-minio:9000')
                  client = Minio(endpoint, access_key=os.environ.get('S3_ACCESS_KEY','minioadmin'), secret_key=os.environ.get('S3_SECRET_KEY','minioadmin'), secure=False)
                  dest = target / prefix.rstrip('/').split('/')[-1]
                  dest.mkdir(parents=True, exist_ok=True)
                  for obj in client.list_objects(bucket, prefix=prefix+'/', recursive=True):
                      fname = obj.object_name.split('/')[-1]
                      if not fname: continue
                      fpath = dest / fname
                      if fpath.exists() and fpath.stat().st_size == obj.size:
                          log.info(f'  Cached: {fname}')
                          continue
                      log.info(f'  Downloading: {fname} ({obj.size/(1024**3):.2f} GB)')
                      client.fget_object(bucket, obj.object_name, str(fpath))
                  log.info(f'S3 sync complete: {dest}')
              else:
                  from huggingface_hub import snapshot_download
                  cached = target / source.replace('/', '--')
                  if cached.exists() and list(cached.glob('*.safetensors')):
                      log.info(f'Using cached model at {cached}')
                  else:
                      log.info(f'Downloading from HuggingFace: {source}')
                      snapshot_download(repo_id=source, local_dir=str(cached), local_dir_use_symlinks=False)
              log.info('Model loader done.')
              "
          env:
            - name: MODEL_SOURCE
              value: {{ $model.source | quote }}
            - name: MODEL_DIR
              value: /models
            - name: HF_HOME
              value: /models/huggingface
          {{- if $.Values.modelLoader.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-hf-token
                  key: token
          {{- end }}
          {{- if $.Values.customCACert.enabled }}
            - name: REQUESTS_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /ca-out/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
          {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            {{- if $.Values.customCACert.enabled }}
            - name: ca-bundle
              mountPath: /ca-out
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
        {{- end }}
      containers:
        - name: vllm
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- if hasPrefix "s3://" $model.source }}
              {{- $s3parts := splitList "/" (trimPrefix "s3://" $model.source) }}
              MODEL_PATH="/models/{{ last $s3parts }}"
              {{- else }}
              MODEL_PATH="{{ $model.source }}"
              {{- end }}

              # ── Auto-compute max-model-len if not explicitly set ──
              {{- $hasMaxLen := false }}
              {{- range $key, $val := $model.engineArgs }}
              {{- if eq $key "--max-model-len" }}{{ $hasMaxLen = true }}{{- end }}
              {{- end }}
              {{- if not $hasMaxLen }}
              MAX_MODEL_LEN=$(python3 -c "
              import json, os, glob, torch

              # 1. Read model config
              cfg_candidates = [
                  os.path.join('$MODEL_PATH', 'config.json'),
                  glob.glob('/models/huggingface/hub/models--*/snapshots/*/config.json')[0] if glob.glob('/models/huggingface/hub/models--*/snapshots/*/config.json') else ''
              ]
              cfg_path = next((p for p in cfg_candidates if p and os.path.exists(p)), None)
              if not cfg_path:
                  print(4096); exit()
              cfg = json.load(open(cfg_path))

              # Model's max supported context
              model_max = cfg.get('max_position_embeddings') or cfg.get('max_sequence_length') or 32768

              # 2. Estimate KV cache memory per token
              # For MoE models, check text_config/language_model config
              tcfg = cfg.get('text_config') or cfg.get('language_model_config') or cfg
              n_layers = tcfg.get('num_hidden_layers', 32)
              n_kv_heads = tcfg.get('num_key_value_heads', tcfg.get('num_attention_heads', 32))
              head_dim = tcfg.get('head_dim', tcfg.get('hidden_size', 4096) // tcfg.get('num_attention_heads', 32))
              dtype_bytes = 2  # float16/bfloat16

              kv_per_token = 2 * n_layers * n_kv_heads * head_dim * dtype_bytes
              print(f'KV cache per token: {kv_per_token / 1024:.1f} KB ({n_layers}L, {n_kv_heads}KVH, {head_dim}D)', flush=True, file=__import__('sys').stderr)

              # 3. Get available memory
              free, total = torch.cuda.mem_get_info()
              gpu_util = {{ $model.engineArgs | dig "--gpu-memory-utilization" "0.8" }}
              budget = total * gpu_util

              # 4. Estimate model weight size from files
              weight_size = 0
              for pattern in ['$MODEL_PATH/*.safetensors', '$MODEL_PATH/*.bin']:
                  for f in glob.glob(pattern):
                      weight_size += os.path.getsize(f)
              if weight_size == 0:
                  weight_size = 65 * 1024**3  # fallback 65GB estimate

              # 5. Calculate max context
              kv_budget = budget - weight_size * 1.1  # 10% overhead
              if kv_budget < 1024**3:  # less than 1GB
                  kv_budget = 1024**3
              max_ctx = int(kv_budget / kv_per_token)
              max_ctx = min(max_ctx, model_max)
              max_ctx = max(max_ctx, 1024)  # minimum 1K
              # Round down to nearest 256
              max_ctx = (max_ctx // 256) * 256
              print(f'Auto context: budget={kv_budget/(1024**3):.1f}GB, per_token={kv_per_token}B -> max_model_len={max_ctx} (model_max={model_max})', flush=True, file=__import__('sys').stderr)
              print(max_ctx)
              " 2>/dev/null || echo 4096)
              echo "Auto-computed max-model-len: $MAX_MODEL_LEN"
              EXTRA_ARGS="--max-model-len $MAX_MODEL_LEN"
              {{- else }}
              EXTRA_ARGS=""
              {{- end }}

              exec vllm serve "$MODEL_PATH" \
                --host 0.0.0.0 \
                --port 8000 \
                --served-model-name {{ $model.name | quote }} \
                {{- if gt (int $gpu) 1 }}
                --tensor-parallel-size {{ $gpu | quote }} \
                {{- end }}
                {{- range $key, $val := $model.engineArgs }}
                {{ $key }} {{ if $val }}{{ $val }}{{ end }} \
                {{- end }}
                $EXTRA_ARGS
          env:
            - name: HF_HOME
              value: /models/huggingface
          {{- if $.Values.modelLoader.hfToken }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-hf-token
                  key: token
          {{- end }}
          {{- if $.Values.customCACert.enabled }}
            - name: REQUESTS_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /ca-out/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
          {{- end }}
          {{- range $envKey, $envVal := $model.extraEnv }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          resources:
            requests:
              cpu: {{ $cpu | quote }}
              memory: {{ $memory }}
              {{- if gt (int $gpu) 0 }}
              nvidia.com/gpu: {{ $gpu | quote }}
              {{- end }}
            limits:
              {{- if $memoryLimit }}
              memory: {{ $memoryLimit }}
              {{- end }}
              {{- if gt (int $gpu) 0 }}
              nvidia.com/gpu: {{ $gpu | quote }}
              {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            {{- if $.Values.customCACert.enabled }}
            - name: ca-bundle
              mountPath: /ca-out
              readOnly: true
            {{- end }}
      {{- if gt (int $gpu) 0 }}
      tolerations:
        - key: {{ $.Values.gpuToleration.key }}
          operator: {{ $.Values.gpuToleration.operator }}
          effect: {{ $.Values.gpuToleration.effect }}
      {{- end }}
      volumes:
        - name: model-cache
          {{- if and $.Values.modelCache.enabled (not $.Values.modelCache.existingClaim) }}
          persistentVolumeClaim:
            claimName: vllm-{{ $model.name }}-cache
          {{- else if $.Values.modelCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelCache.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $.Values.modelCache.size }}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        {{- if $.Values.customCACert.enabled }}
        - name: custom-ca
          configMap:
            name: {{ $.Values.customCACert.configMapName }}
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
{{- end }}
{{- end }}
