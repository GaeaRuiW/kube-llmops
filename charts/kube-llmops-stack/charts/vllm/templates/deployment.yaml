{{/*
This template renders one Deployment per model entry that uses vllm engine.
It is called from the parent chart with model-specific context.
*/}}
{{- $models := .Values.models }}
{{- if and .Values.global .Values.global.models }}
{{- $models = .Values.global.models }}
{{- end }}
{{- range $idx, $model := $models }}
{{- $resolvedEngine := include "kube-llmops.resolveEngine" $model | trim }}
{{- if eq $resolvedEngine "vllm" }}
{{- $resources := default dict $model.resources }}
{{- $gpu := ternary (int $resources.gpu) 1 (hasKey $resources "gpu") }}
{{- $memory := default "16Gi" $resources.memory }}
{{- $memoryLimit := $resources.memoryLimit }}
{{- $cpu := default "4" $resources.cpu }}
{{- $replicas := default 1 $model.replicas }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ $model.name }}
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: kube-llmops
    kube-llmops/model: {{ $model.name }}
    kube-llmops/engine: vllm
spec:
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: {{ $.Release.Name }}
      kube-llmops/model: {{ $model.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: model-serving
        app.kubernetes.io/part-of: kube-llmops
        kube-llmops/model: {{ $model.name }}
        kube-llmops/engine: vllm
    spec:
      enableServiceLinks: false
      initContainers:
        {{- if $.Values.customCACert.enabled }}
        - name: ca-cert-installer
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              cp /custom-ca/* /usr/local/share/ca-certificates/ 2>/dev/null || true
              update-ca-certificates 2>/dev/null || cat /custom-ca/*.crt >> /etc/ssl/certs/ca-certificates.crt
              cp /etc/ssl/certs/ca-certificates.crt /ca-out/ca-certificates.crt
              echo "CA certs updated"
          volumeMounts:
            - name: custom-ca
              mountPath: /custom-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-out
        {{- end }}
        - name: model-loader
          image: {{ (default dict (default dict $.Values.global).modelStore).image | default "kube-llmops/model-loader:latest" }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
{{ include "kube-llmops.modelLoaderScript" . | indent 14 }}
          env:
{{ include "kube-llmops.modelLoaderEnv" (dict "model" $model "root" $ "mountPath" "/models" "hfHome" "/models/huggingface" "hfToken" $.Values.modelLoader.hfToken) | indent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            {{- if $.Values.customCACert.enabled }}
            - name: ca-bundle
              mountPath: /ca-out
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
        {{- if $.Values.unifiedMemory.enabled }}
        - name: drop-cache
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              # Unified memory GPU: model-loader reads/writes fill page cache,
              # which CUDA reports as "used" GPU memory. Drop it AFTER model
              # download so vLLM can allocate GPU memory cleanly.
              UNIFIED=false
              for f in /proc/driver/nvidia/gpus/*/information; do
                [ -f "$f" ] && grep -qi "blackwell\|gb[0-9]\|grace" "$f" 2>/dev/null && UNIFIED=true
              done
              if [ "$UNIFIED" = "true" ]; then
                echo "[drop-cache] Unified memory GPU confirmed, dropping page cache..."
                echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
                cat /proc/meminfo | head -3
              else
                echo "[drop-cache] WARNING: unifiedMemory.enabled=true but no unified GPU detected. Dropping cache anyway."
                echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
              fi
          securityContext:
            privileged: true
        {{- end }}
      containers:
        - name: vllm
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- $slug := replace "/" "--" $model.source }}
              MODEL_PATH="/models/{{ $slug }}"
              # Fallback: if model-loader didn't populate, use HF repo ID
              if [ ! -d "$MODEL_PATH" ] || [ -z "$(ls -A "$MODEL_PATH" 2>/dev/null)" ]; then
                MODEL_PATH="{{ $model.source }}"
              fi

              # ── Auto-compute max-model-len if not explicitly set ──
              {{- $hasMaxLen := false }}
              {{- range $key, $val := $model.engineArgs }}
              {{- if eq $key "--max-model-len" }}{{ $hasMaxLen = true }}{{- end }}
              {{- end }}
              {{- if not $hasMaxLen }}
              MAX_MODEL_LEN=$(python3 -c "
              import json, os, glob, torch

              # 1. Read model config
              cfg_candidates = [
                  os.path.join('$MODEL_PATH', 'config.json'),
                  glob.glob('/models/huggingface/hub/models--*/snapshots/*/config.json')[0] if glob.glob('/models/huggingface/hub/models--*/snapshots/*/config.json') else ''
              ]
              cfg_path = next((p for p in cfg_candidates if p and os.path.exists(p)), None)
              if not cfg_path:
                  print(4096); exit()
              cfg = json.load(open(cfg_path))

              # Model's max supported context
              model_max = cfg.get('max_position_embeddings') or cfg.get('max_sequence_length') or 32768

              # 2. Estimate KV cache memory per token
              # For MoE models, check text_config/language_model config
              tcfg = cfg.get('text_config') or cfg.get('language_model_config') or cfg
              n_layers = tcfg.get('num_hidden_layers', 32)
              n_kv_heads = tcfg.get('num_key_value_heads', tcfg.get('num_attention_heads', 32))
              head_dim = tcfg.get('head_dim', tcfg.get('hidden_size', 4096) // tcfg.get('num_attention_heads', 32))
              dtype_bytes = 2  # float16/bfloat16

              kv_per_token = 2 * n_layers * n_kv_heads * head_dim * dtype_bytes
              print(f'KV cache per token: {kv_per_token / 1024:.1f} KB ({n_layers}L, {n_kv_heads}KVH, {head_dim}D)', flush=True, file=__import__('sys').stderr)

              # 3. Get available memory
              free, total = torch.cuda.mem_get_info()
              gpu_util = {{ (default dict $model.engineArgs) | dig "--gpu-memory-utilization" "0.8" }}
              budget = total * gpu_util

              # 4. Estimate model weight size from files
              weight_size = 0
              for pattern in ['$MODEL_PATH/*.safetensors', '$MODEL_PATH/*.bin']:
                  for f in glob.glob(pattern):
                      weight_size += os.path.getsize(f)
              if weight_size == 0:
                  weight_size = 65 * 1024**3  # fallback 65GB estimate

              # 5. Calculate max context
              kv_budget = budget - weight_size * 1.1  # 10% overhead
              if kv_budget < 1024**3:  # less than 1GB
                  kv_budget = 1024**3
              max_ctx = int(kv_budget / kv_per_token)
              max_ctx = min(max_ctx, model_max)
              max_ctx = max(max_ctx, 1024)  # minimum 1K
              # Round down to nearest 256
              max_ctx = (max_ctx // 256) * 256
              print(f'Auto context: budget={kv_budget/(1024**3):.1f}GB, per_token={kv_per_token}B -> max_model_len={max_ctx} (model_max={model_max})', flush=True, file=__import__('sys').stderr)
              print(max_ctx)
              " 2>/dev/null || echo 4096)
              echo "Auto-computed max-model-len: $MAX_MODEL_LEN"
              EXTRA_ARGS="--max-model-len $MAX_MODEL_LEN"
              {{- else }}
              EXTRA_ARGS=""
              {{- end }}

              exec vllm serve "$MODEL_PATH" \
                --host 0.0.0.0 \
                --port 8000 \
                --served-model-name {{ $model.name | quote }} \
                {{- if $model.prefixCaching }}
                --enable-prefix-caching \
                {{- end }}
                {{- if gt (int $gpu) 1 }}
                --tensor-parallel-size {{ $gpu | quote }} \
                {{- end }}
                {{- range $key, $val := $model.engineArgs }}
                {{ $key }} {{ if $val }}{{ $val }}{{ end }} \
                {{- end }}
                $EXTRA_ARGS
          env:
            - name: HF_HOME
              value: /models/huggingface
          {{- if or $.Values.modelLoader.hfToken (and $.Values.global $.Values.global.hfToken) }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-hf-token
                  key: token
          {{- end }}
          {{- if $.Values.customCACert.enabled }}
            - name: REQUESTS_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /ca-out/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
          {{- end }}
          {{- range $envKey, $envVal := $model.extraEnv }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          resources:
            requests:
              cpu: {{ $cpu | quote }}
              memory: {{ $memory }}
              {{- if gt (int $gpu) 0 }}
              nvidia.com/gpu: {{ $gpu | quote }}
              {{- end }}
            limits:
              {{- if not $.Values.unifiedMemory.enabled }}
              memory: {{ $memoryLimit | default $memory }}
              {{- end }}
              {{- if gt (int $gpu) 0 }}
              nvidia.com/gpu: {{ $gpu | quote }}
              {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            {{- if $.Values.customCACert.enabled }}
            - name: ca-bundle
              mountPath: /ca-out
              readOnly: true
            {{- end }}
      {{- if gt (int $gpu) 0 }}
      tolerations:
        - key: {{ $.Values.gpuToleration.key }}
          operator: {{ $.Values.gpuToleration.operator }}
          effect: {{ $.Values.gpuToleration.effect }}
      {{- end }}
      volumes:
        - name: model-cache
          {{- if and $.Values.modelCache.enabled (not $.Values.modelCache.existingClaim) }}
          persistentVolumeClaim:
            claimName: vllm-{{ $model.name }}-cache
          {{- else if $.Values.modelCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelCache.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $.Values.modelCache.size }}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        {{- if $.Values.customCACert.enabled }}
        - name: custom-ca
          configMap:
            name: {{ $.Values.customCACert.configMapName }}
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
{{- end }}
{{- end }}
