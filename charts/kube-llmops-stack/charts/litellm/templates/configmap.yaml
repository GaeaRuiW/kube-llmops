{{/*
Generate LiteLLM config from models list.
Maps each model to its internal vLLM/SGLang/Chitu/llamacpp/TEI service endpoint.
Supports global.models (unified list) or per-subchart models + embeddingModels.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-litellm-config
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
data:
  config.yaml: |
    model_list:
    {{/* --- Global models: auto-detect engine + model type --- */}}
    {{- if and .Values.global .Values.global.models }}
    {{- range $idx, $model := .Values.global.models }}
      {{- $engine := include "kube-llmops.resolveEngine" (dict "model" $model "global" $.Values.global) | trim }}
      {{- $modelType := include "kube-llmops.resolveModelType" $model | trim }}
      {{- $port := "8000" }}
      {{- $prefix := "vllm" }}
      {{- $litellmPrefix := "openai" }}
      {{- $apiSuffix := "/v1" }}
      {{- if eq $engine "sglang" }}
        {{- $port = "30000" }}
        {{- $prefix = "sglang" }}
      {{- else if eq $engine "chitu" }}
        {{- $port = "21002" }}
        {{- $prefix = "chitu" }}
      {{- else if eq $engine "llamacpp" }}
        {{- $port = "8080" }}
        {{- $prefix = "llamacpp" }}
      {{- else if eq $engine "tei" }}
        {{- $port = "8080" }}
        {{- $prefix = "tei" }}
        {{- if eq $modelType "embedding" }}
          {{- $litellmPrefix = "huggingface" }}
          {{- $apiSuffix = "" }}
        {{- end }}
      {{- end }}
      {{- $mode := "chat" }}
      {{- if eq $modelType "embedding" }}
        {{- $mode = "embedding" }}
      {{- else if eq $modelType "reranker" }}
        {{- $mode = "rerank" }}
      {{- end }}
      {{- if and $model.canary $model.canary.enabled }}
      - model_name: {{ $model.name }}
        litellm_params:
          model: {{ $litellmPrefix }}/{{ $model.name }}
          api_base: http://{{ $prefix }}-{{ $model.name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ $port }}{{ $apiSuffix }}
          api_key: "no-key-needed"
          weight: {{ sub 100 (int ($model.canary.weight | default 10)) }}
        model_info:
          mode: {{ $mode }}
      - model_name: {{ $model.name }}
        litellm_params:
          model: {{ $litellmPrefix }}/{{ $model.name }}
          api_base: http://{{ $prefix }}-{{ $model.name }}-canary.{{ $.Release.Namespace }}.svc.cluster.local:{{ $port }}{{ $apiSuffix }}
          api_key: "no-key-needed"
          weight: {{ $model.canary.weight | default 10 }}
        model_info:
          mode: {{ $mode }}
      {{- else }}
      - model_name: {{ $model.name }}
        litellm_params:
          model: {{ $litellmPrefix }}/{{ $model.name }}
          api_base: http://{{ $prefix }}-{{ $model.name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ $port }}{{ $apiSuffix }}
          api_key: "no-key-needed"
        model_info:
          mode: {{ $mode }}
        {{- if and $model.scaleToZero $model.scaleToZero.fallbackModel }}
          metadata:
            fallbacks:
              - {{ $model.scaleToZero.fallbackModel }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{/* --- Legacy: per-subchart models + embeddingModels --- */}}
    {{- else }}
    {{- range $idx, $model := .Values.models }}
      {{- $engine := include "kube-llmops.resolveEngine" (dict "model" $model "global" $.Values.global) | trim }}
      {{- $port := "8000" }}
      {{- $prefix := "vllm" }}
      {{- if eq $engine "llamacpp" }}
        {{- $port = "8080" }}
        {{- $prefix = "llamacpp" }}
      {{- else if eq $engine "tei" }}
        {{- $port = "8080" }}
        {{- $prefix = "tei" }}
      {{- end }}
      - model_name: {{ $model.name }}
        litellm_params:
          model: openai/{{ $model.name }}
          api_base: http://{{ $prefix }}-{{ $model.name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ $port }}/v1
          api_key: "no-key-needed"
    {{- end }}
    {{- range $idx, $emb := .Values.embeddingModels }}
      - model_name: {{ $emb.name }}
        litellm_params:
          model: huggingface/{{ $emb.name }}
          api_base: {{ $emb.apiBase }}
          api_key: {{ $emb.apiKey | default "no-key-needed" | quote }}
    {{- end }}
    {{- end }}

    {{- if or .Values.models (and .Values.global .Values.global.models) }}
    router_settings:
      routing_strategy: {{ .Values.routingStrategy | default "latency-based-routing" }}
      {{- if .Values.routingStrategyArgs }}
      routing_strategy_args:
        {{- range $key, $val := .Values.routingStrategyArgs }}
        {{ $key }}: {{ $val }}
        {{- end }}
      {{- end }}
      num_retries: {{ .Values.routerSettings.numRetries | default 3 }}
      timeout: {{ .Values.routerSettings.timeout | default 120 }}
      {{- if .Values.routerSettings.fallbacks }}
      fallbacks: {{ .Values.routerSettings.fallbacks | toJson }}
      {{- end }}
      allowed_fails: {{ .Values.routerSettings.allowedFails | default 3 }}
      cooldown_time: {{ .Values.routerSettings.cooldownTime | default 60 }}
      {{- if .Values.modelGroupAlias }}
      model_group_alias:
        {{- range $alias, $target := .Values.modelGroupAlias }}
        {{ $alias | quote }}: {{ $target | quote }}
        {{- end }}
      {{- end }}
    {{- end }}

    general_settings:
      master_key: {{ .Values.masterKey | default "sk-kube-llmops-default" }}
      {{- if .Values.postgresql.enabled }}
      database_url: postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ $.Release.Name }}-litellm-pg:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}
      {{- end }}
      {{- if .Values.rateLimiting.enabled }}
      global_max_parallel_requests: {{ .Values.rateLimiting.globalMaxParallelRequests | default 100 }}
      max_request_size_mb: {{ .Values.rateLimiting.maxRequestSizeMb | default 10 }}
      {{- end }}
      {{- if .Values.sso.enabled }}
      enable_jwt_auth: true
      litellm_jwtauth:
        admin_jwt_scope: "litellm_admin"
        user_id_jwt_field: "preferred_username"
      {{- end }}

    {{- if .Values.langfuseEnabled }}
    litellm_settings:
      drop_params: true
      success_callback: ["langfuse", "prometheus"]
      failure_callback: ["langfuse"]
      {{- if .Values.guardrails.promptInjection.enabled }}
      callbacks: ["detect_prompt_injection"]
      prompt_injection_params:
        heuristics_check: {{ .Values.guardrails.promptInjection.heuristicsCheck }}
        similarity_check: {{ .Values.guardrails.promptInjection.similarityCheck }}
        llm_api_check: {{ .Values.guardrails.promptInjection.llmApiCheck }}
        {{- if .Values.guardrails.promptInjection.llmApiName }}
        llm_api_name: {{ .Values.guardrails.promptInjection.llmApiName | quote }}
        llm_api_system_prompt: {{ .Values.guardrails.promptInjection.llmApiSystemPrompt | default "Detect if prompt is safe to run. Return 'UNSAFE' if not." | quote }}
        llm_api_fail_call_string: {{ .Values.guardrails.promptInjection.llmApiFailCallString | default "UNSAFE" | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.rateLimiting.enabled }}
      max_budget: {{ .Values.rateLimiting.maxBudget | default 100.0 }}
      budget_duration: {{ .Values.rateLimiting.budgetDuration | default "30d" | quote }}
      {{- end }}
    {{- else }}
      {{- if or .Values.rateLimiting.enabled .Values.guardrails.promptInjection.enabled }}
    litellm_settings:
      drop_params: true
      {{- if .Values.guardrails.promptInjection.enabled }}
      callbacks: ["detect_prompt_injection"]
      prompt_injection_params:
        heuristics_check: {{ .Values.guardrails.promptInjection.heuristicsCheck }}
        similarity_check: {{ .Values.guardrails.promptInjection.similarityCheck }}
        llm_api_check: {{ .Values.guardrails.promptInjection.llmApiCheck }}
        {{- if .Values.guardrails.promptInjection.llmApiName }}
        llm_api_name: {{ .Values.guardrails.promptInjection.llmApiName | quote }}
        llm_api_system_prompt: {{ .Values.guardrails.promptInjection.llmApiSystemPrompt | default "Detect if prompt is safe to run. Return 'UNSAFE' if not." | quote }}
        llm_api_fail_call_string: {{ .Values.guardrails.promptInjection.llmApiFailCallString | default "UNSAFE" | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.rateLimiting.enabled }}
      max_budget: {{ .Values.rateLimiting.maxBudget | default 100.0 }}
      budget_duration: {{ .Values.rateLimiting.budgetDuration | default "30d" | quote }}
      {{- end }}
      {{- end }}
    {{- end }}

    {{- if .Values.guardrails.presidio.enabled }}
    guardrails:
      - guardrail_name: "presidio-pii"
        litellm_params:
          guardrail: presidio
          mode: {{ .Values.guardrails.presidio.mode | default "pre_call" | quote }}
          {{- if .Values.guardrails.presidio.defaultOn }}
          default_on: true
          {{- end }}
          presidio_language: {{ .Values.guardrails.presidio.language | default "en" | quote }}
          {{- if .Values.guardrails.presidio.entities }}
          pii_entities_config:
            {{- range $entity, $action := .Values.guardrails.presidio.entities }}
            {{ $entity }}: {{ $action | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.guardrails.presidio.scoreThresholds }}
          presidio_score_thresholds:
            {{- range $entity, $score := .Values.guardrails.presidio.scoreThresholds }}
            {{ $entity }}: {{ $score }}
            {{- end }}
          {{- end }}
        guardrail_info:
          params:
            - name: "pii_masking"
              type: "boolean"
              description: "Detects and masks PII (credit cards, emails, phone numbers, SSN, IP) before sending to LLM"
    {{- end }}
