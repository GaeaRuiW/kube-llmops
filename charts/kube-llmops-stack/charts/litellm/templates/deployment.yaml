apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: kube-llmops
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: ai-gateway
        app.kubernetes.io/part-of: kube-llmops
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: litellm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Polyfill crypto.randomUUID for non-secure contexts (plain HTTP NodePort)
              for UI_DIR in \
                /usr/lib/python3.*/site-packages/litellm/proxy/_experimental/out/_next/static/chunks \
                /app/litellm/proxy/_experimental/out/_next/static/chunks; do
                [ -d "$UI_DIR" ] || continue
                for f in "$UI_DIR"/*.js; do
                  if grep -q 'crypto\.randomUUID' "$f" 2>/dev/null && ! grep -q '__RANDOMUUID_POLYFILL__' "$f" 2>/dev/null; then
                    { printf '/* __RANDOMUUID_POLYFILL__ */ if(typeof crypto!=="undefined"&&!crypto.randomUUID){crypto.randomUUID=function(){return([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,function(c){return(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)});}};'; cat "$f"; } > "$f.tmp" && mv "$f.tmp" "$f"
                  fi
                done
              done
              exec litellm --config /app/config.yaml --port 4000 --host 0.0.0.0
          env:
            - name: LITELLM_MASTER_KEY
              value: {{ .Values.masterKey | default "sk-kube-llmops-default" | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ $.Release.Name }}-litellm-pg:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
            {{- end }}
            {{- if .Values.langfuseEnabled }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.langfusePublicKey | default "pk-llmops" | quote }}
            - name: LANGFUSE_SECRET_KEY
              value: {{ .Values.langfuseSecretKey | default "sk-llmops" | quote }}
            - name: LANGFUSE_HOST
              value: "http://{{ $.Release.Name }}-langfuse:3000"
            {{- end }}
            {{- if .Values.sso.enabled }}
            - name: GENERIC_CLIENT_ID
              value: {{ .Values.sso.clientId | default "litellm" | quote }}
            - name: GENERIC_CLIENT_SECRET
              value: {{ .Values.sso.clientSecret | default "" | quote }}
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "{{ .Values.sso.issuerUrl }}/protocol/openid-connect/auth"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "{{ .Values.sso.internalIssuerUrl | default .Values.sso.issuerUrl }}/protocol/openid-connect/token"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "{{ .Values.sso.internalIssuerUrl | default .Values.sso.issuerUrl }}/protocol/openid-connect/userinfo"
            - name: PROXY_BASE_URL
              value: {{ .Values.sso.proxyBaseUrl | default "http://litellm.llmops.local" | quote }}
            {{- end }}
            {{- if .Values.guardrails.presidio.enabled }}
            - name: PRESIDIO_ANALYZER_API_BASE
              value: "http://{{ $.Release.Name }}-presidio-analyzer:3000"
            - name: PRESIDIO_ANONYMIZER_API_BASE
              value: "http://{{ $.Release.Name }}-presidio-anonymizer:3000"
            {{- end }}
            - name: UI_USERNAME
              value: {{ .Values.ui.username | default "admin" | quote }}
            - name: UI_PASSWORD
              value: {{ .Values.ui.password | default .Values.masterKey | default "sk-kube-llmops-default" | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: 4000
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: 4000
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $.Release.Name }}-litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: ai-gateway
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ $.Release.Name }}
