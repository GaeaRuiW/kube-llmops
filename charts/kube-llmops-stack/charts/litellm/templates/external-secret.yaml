{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-litellm-external-secret
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore | default "vault-backend" }}
    kind: SecretStore
  target:
    name: {{ .Release.Name }}-litellm-secret
    creationPolicy: Owner
  data:
    - secretKey: master-key
      remoteRef:
        key: {{ .Values.externalSecrets.keyPath | default "kube-llmops/litellm" }}
        property: master-key
    - secretKey: postgresql-password
      remoteRef:
        key: {{ .Values.externalSecrets.keyPath | default "kube-llmops/litellm" }}
        property: postgresql-password
{{- end }}
