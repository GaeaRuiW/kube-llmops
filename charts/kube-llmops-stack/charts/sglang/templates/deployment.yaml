{{/*
This template renders one Deployment per model entry that uses sglang engine.
It is called from the parent chart with model-specific context.
*/}}
{{- $models := .Values.models }}
{{- if and .Values.global .Values.global.models }}
{{- $models = .Values.global.models }}
{{- end }}
{{- range $idx, $model := $models }}
{{- $resolvedEngine := include "kube-llmops.resolveEngine" (dict "model" $model "global" $.Values.global) | trim }}
{{- if eq $resolvedEngine "sglang" }}
{{- $resources := default dict $model.resources }}
{{- $gpu := ternary (int $resources.gpu) 1 (hasKey $resources "gpu") }}
{{- $memory := default "16Gi" $resources.memory }}
{{- $memoryLimit := $resources.memoryLimit }}
{{- $cpu := default "4" $resources.cpu }}
{{- $replicas := default 1 $model.replicas }}
{{- $slug := replace "/" "--" $model.source }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-{{ $model.name }}
  labels:
    app.kubernetes.io/name: sglang
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: model-serving
    app.kubernetes.io/part-of: kube-llmops
    kube-llmops/model: {{ $model.name }}
    kube-llmops/engine: sglang
spec:
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sglang
      app.kubernetes.io/instance: {{ $.Release.Name }}
      kube-llmops/model: {{ $model.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sglang
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: model-serving
        app.kubernetes.io/part-of: kube-llmops
        kube-llmops/model: {{ $model.name }}
        kube-llmops/engine: sglang
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      initContainers:
        {{- if $.Values.customCACert.enabled }}
        - name: ca-cert-installer
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              cp /custom-ca/* /usr/local/share/ca-certificates/ 2>/dev/null || true
              update-ca-certificates 2>/dev/null || cat /custom-ca/*.crt >> /etc/ssl/certs/ca-certificates.crt
              cp /etc/ssl/certs/ca-certificates.crt /ca-out/ca-certificates.crt
              echo "CA certs updated"
          volumeMounts:
            - name: custom-ca
              mountPath: /custom-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-out
        {{- end }}
        - name: model-loader
          image: {{ (default dict (default dict $.Values.global).modelStore).image | default "kube-llmops/model-loader:latest" }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
{{ include "kube-llmops.modelLoaderScript" . | indent 14 }}
          env:
{{ include "kube-llmops.modelLoaderEnv" (dict "model" $model "root" $ "mountPath" "/models" "hfHome" "/models/huggingface" "hfToken" $.Values.modelLoader.hfToken) | indent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            {{- if $.Values.customCACert.enabled }}
            - name: ca-bundle
              mountPath: /ca-out
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
        {{- if $.Values.unifiedMemory.enabled }}
        - name: drop-cache
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              # Unified memory GPU: model-loader reads/writes fill page cache,
              # which CUDA reports as "used" GPU memory. Drop it AFTER model
              # download so SGLang can allocate GPU memory cleanly.
              UNIFIED=false
              for f in /proc/driver/nvidia/gpus/*/information; do
                [ -f "$f" ] && grep -qi "blackwell\|gb[0-9]\|grace" "$f" 2>/dev/null && UNIFIED=true
              done
              if [ "$UNIFIED" = "true" ]; then
                echo "[drop-cache] Unified memory GPU confirmed, dropping page cache..."
                echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
                cat /proc/meminfo | head -3
              else
                echo "[drop-cache] WARNING: unifiedMemory.enabled=true but no unified GPU detected. Dropping cache anyway."
                echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
              fi
          securityContext:
            privileged: true
        {{- end }}
      containers:
        - name: sglang
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 30000
              protocol: TCP
          command: ["/bin/bash", "-c"]
          args:
            - |
              MODEL_PATH="/models/{{ $slug }}"
              # Fallback: if model-loader didn't populate, use HF repo ID
              if [ ! -d "$MODEL_PATH" ] || [ -z "$(ls -A "$MODEL_PATH" 2>/dev/null)" ]; then
                MODEL_PATH="{{ $model.source }}"
              fi

              exec python3 -m sglang.launch_server \
                --model-path "$MODEL_PATH" \
                --host 0.0.0.0 \
                --port 30000 \
                --served-model-name {{ $model.name | quote }} \
                {{- if $model.prefixCaching }}
                --enable-radix-attention \
                {{- end }}
                {{- if gt (int $gpu) 1 }}
                --tp {{ $gpu | quote }} \
                {{- end }}
                {{- range $key, $val := $model.engineArgs }}
                {{ $key }} {{ if $val }}{{ $val }}{{ end }} \
                {{- end }}

          env:
            - name: HF_HOME
              value: /models/huggingface
          {{- if or $.Values.modelLoader.hfToken (and $.Values.global $.Values.global.hfToken) }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-hf-token
                  key: token
          {{- end }}
          {{- if $.Values.customCACert.enabled }}
            - name: REQUESTS_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /ca-out/ca-certificates.crt
            - name: CURL_CA_BUNDLE
              value: /ca-out/ca-certificates.crt
          {{- end }}
          {{- range $envKey, $envVal := $model.extraEnv }}
            - name: {{ $envKey }}
              value: {{ $envVal | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 30000
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: 30000
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          resources:
            requests:
              cpu: {{ $cpu | quote }}
              memory: {{ $memory }}
              {{- if $resources.migDevice }}
              {{ $resources.migDevice }}: "1"
              {{- else if gt (int $gpu) 0 }}
              {{ include "kube-llmops.gpuResourceName" $ }}: {{ $gpu | quote }}
              {{- end }}
            limits:
              {{- if not $.Values.unifiedMemory.enabled }}
              memory: {{ $memoryLimit | default $memory }}
              {{- end }}
              {{- if $resources.migDevice }}
              {{ $resources.migDevice }}: "1"
              {{- else if gt (int $gpu) 0 }}
              {{ include "kube-llmops.gpuResourceName" $ }}: {{ $gpu | quote }}
              {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            {{- if $.Values.customCACert.enabled }}
            - name: ca-bundle
              mountPath: /ca-out
              readOnly: true
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      {{- if gt (int $gpu) 0 }}
      tolerations:
        - key: {{ include "kube-llmops.gpuTolerationKey" $ }}
          operator: {{ $.Values.gpuToleration.operator }}
          effect: {{ $.Values.gpuToleration.effect }}
        {{- if $model.spotToleration }}
        - key: kubernetes.azure.com/scalesetpriority
          value: spot
          effect: NoSchedule
        - key: cloud.google.com/gke-spot
          value: "true"
          effect: NoSchedule
        - key: karpenter.sh/capacity-type
          value: spot
          effect: NoSchedule
        {{- end }}
      {{- end }}
      volumes:
        - name: model-cache
          {{- if and $.Values.modelCache.enabled (not $.Values.modelCache.existingClaim) }}
          persistentVolumeClaim:
            claimName: sglang-{{ $model.name }}-cache
          {{- else if $.Values.modelCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.modelCache.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $.Values.modelCache.size }}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        {{- if $.Values.customCACert.enabled }}
        - name: custom-ca
          configMap:
            name: {{ $.Values.customCACert.configMapName }}
        - name: ca-bundle
          emptyDir: {}
        {{- end }}
{{- end }}
{{- end }}
