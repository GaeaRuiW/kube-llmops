{{/*
NodePort Services — expose all user-facing services on fixed ports.
Enable with: --set global.nodePort.enabled=true

Access via: http://<NODE_IP>:<PORT>
*/}}
{{- if and .Values.global .Values.global.nodePort .Values.global.nodePort.enabled }}
{{- $np := .Values.global.nodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-litellm-np
  labels:
    app.kubernetes.io/name: litellm-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: {{ $np.litellm | default 30400 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana-np
  labels:
    app.kubernetes.io/name: grafana-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: {{ $np.grafana | default 30300 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-langfuse-np
  labels:
    app.kubernetes.io/name: langfuse-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: {{ $np.langfuse | default 30301 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak-np
  labels:
    app.kubernetes.io/name: keycloak-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: {{ $np.keycloak | default 30808 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus-np
  labels:
    app.kubernetes.io/name: prometheus-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: {{ $np.prometheus | default 30909 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio-np
  labels:
    app.kubernetes.io/name: minio-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: {{ $np.minio | default 30900 }}
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: {{ $np.minioConsole | default 30901 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dify-np
  labels:
    app.kubernetes.io/name: dify-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dify-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: {{ $np.dify | default 30500 }}
{{- end }}
