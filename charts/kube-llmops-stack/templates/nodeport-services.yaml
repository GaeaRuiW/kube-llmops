  selector:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: 4466
      nodePort: {{ $np.headlamp | default 30302 }}
{{- end }}
{{- end }}
