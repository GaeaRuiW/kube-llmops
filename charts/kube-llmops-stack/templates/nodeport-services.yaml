    app.kubernetes.io/name: minio-nodeport
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: kube-llmops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      nodePort: {{ $np.minio | default 30900 }}
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: {{ $np.minioConsole | default 30901 }}
