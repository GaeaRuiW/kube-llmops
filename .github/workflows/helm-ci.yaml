name: Helm CI

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm-ci.yaml"

permissions:
  contents: read

jobs:
  helm-lint-template:
    name: Lint & template (${{ matrix.profile }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        profile:
          - ci
          - minimal
          - standard
          - production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Lint chart with ${{ matrix.profile }} values
        run: |
          helm lint charts/kube-llmops-stack/ \
            --values charts/kube-llmops-stack/values-${{ matrix.profile }}.yaml

      - name: Template chart with ${{ matrix.profile }} values
        run: |
          helm template kube-llmops-stack charts/kube-llmops-stack/ \
            --values charts/kube-llmops-stack/values-${{ matrix.profile }}.yaml \
            > /dev/null

  chart-testing:
    name: Chart testing (ct lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing lint
        run: ct lint --config ct.yaml
