# This rule is not used by the project kube-llmops-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the llmops.kubellmops.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-llmops-operator
    app.kubernetes.io/managed-by: kustomize
  name: modeldeployment-editor-role
rules:
- apiGroups:
  - llmops.kubellmops.io
  resources:
  - modeldeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - llmops.kubellmops.io
  resources:
  - modeldeployments/status
  verbs:
  - get
