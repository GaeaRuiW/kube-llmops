# This rule is not used by the project kube-llmops-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over llmops.kubellmops.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-llmops-operator
    app.kubernetes.io/managed-by: kustomize
  name: finetunerun-admin-role
rules:
- apiGroups:
  - llmops.kubellmops.io
  resources:
  - finetuneruns
  verbs:
  - '*'
- apiGroups:
  - llmops.kubellmops.io
  resources:
  - finetuneruns/status
  verbs:
  - get
