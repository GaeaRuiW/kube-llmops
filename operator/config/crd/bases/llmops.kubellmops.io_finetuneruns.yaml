metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: finetuneruns.llmops.kubellmops.io
spec:
  group: llmops.kubellmops.io
  names:
    kind: FineTuneRun
    listKind: FineTuneRunList
    plural: finetuneruns
    shortNames:
    - ftr
    singular: finetunerun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.baseModel
      name: Base Model
      type: string
    - jsonPath: .spec.method
      name: Method
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.metrics.trainLoss
      name: Loss
      priority: 1
      type: string
    - jsonPath: .status.metrics.trainingDuration
      name: Duration
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FineTuneRun is the Schema for the finetuneruns API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FineTuneRunSpec defines the desired state of a fine-tuning
              job.
            properties:
              baseModel:
                description: BaseModel is the HuggingFace model ID to fine-tune.
                minLength: 1
                type: string
              dataSource:
                description: DataSource configures where training data comes from.
                properties:
                  format:
                    default: alpaca
                    description: Format is the data format.
                    enum:
                    - alpaca
                    - sharegpt
                    - custom
                    type: string
                  path:
                    description: Path is the data location (e.g. "s3://datasets/my-data/"
                      or "tatsu-lab/alpaca").
                    type: string
                  type:
                    description: Type is the data source type.
                    enum:
                    - minio
                    - huggingface
                    - pvc
                    type: string
                required:
                - type
                type: object
              deploy:
                description: Deploy configures auto-deployment after quality gate
                  passes.
                properties:
                  canaryWeight:
                    format: int32
                    type: integer
                  enabled:
                    type: boolean
                type: object
              evaluation:
                description: Evaluation configures post-training evaluation.
                properties:
                  dataset:
                    type: string
                  enabled:
                    type: boolean
                type: object
              method:
                default: lora
                description: Method is the fine-tuning method.
                enum:
                - lora
                - qlora
                - full
                type: string
              outputName:
                description: OutputName is the name for the fine-tuned model artifact.
                minLength: 1
                type: string
              qualityGate:
                description: QualityGate configures pass/fail thresholds.
                properties:
                  enabled:
                    type: boolean
                  thresholds:
                    description: QualityThresholds defines metric thresholds for the
                      quality gate.
                    properties:
                      maxTrainLoss:
                        type: string
                      minEvalLoss:
                        type: string
                    type: object
                type: object
              resources:
                description: Resources for the training container.
                properties:
                  cpu:
                    default: "4"
                    description: CPU is the CPU limit (e.g. "4").
                    type: string
                  gpu:
                    default: 1
                    description: GPU is the number of GPUs to request (0 for CPU-only).
                    format: int32
                    minimum: 0
                    type: integer
                  memory:
                    default: 16Gi
                    description: Memory is the memory limit (e.g. "16Gi").
                    type: string
                type: object
              training:
                description: Training holds hyperparameters.
                properties:
                  batchSize:
                    format: int32
                    type: integer
                  epochs:
                    format: int32
                    type: integer
                  gradientAccumulationSteps:
                    format: int32
                    type: integer
                  learningRate:
                    type: string
                  loraAlpha:
                    format: int32
                    type: integer
                  loraRank:
                    format: int32
                    type: integer
                  loraTarget:
                    type: string
                  warmupRatio:
