            properties:
              argoWorkflow:
                description: ArgoWorkflow is the name of the created Argo Workflow.
                type: string
              completionTime:
                description: CompletionTime is when the run completed.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest observations.
